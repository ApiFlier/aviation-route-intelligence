# FlightConn — Optional SWIM Ingestor Compose Override
#
# This file extends docker-compose.yml with an optional sidecar container
# for FAA SWIM recent flight activity ingestion. The main app (flightconn-app)
# does not depend on this service and runs normally without it.
#
# SWIM is auto-detected: if FAA_USER, FAA_PASS, and at least one QUEUE_* are
# set in deploy.env, setup.sh starts this sidecar automatically. No flags needed.
#
# ── Usage ─────────────────────────────────────────────────────────────────────
#
#   Normal: run setup.sh — it reads deploy.env and starts the sidecar automatically.
#
#   Manual override (without setup.sh):
#        docker compose -f docker-compose.yml -f docker-compose.swim.yml up -d
#
#   Apply schema only:
#        docker compose -f docker-compose.yml -f docker-compose.swim.yml \
#            run --rm swim-ingestor python apply_schema.py
#
#   Rebuild sidecar after code changes:
#        docker compose -f docker-compose.yml -f docker-compose.swim.yml \
#            build swim-ingestor
#
#   Stop sidecar only:
#        docker compose -f docker-compose.yml -f docker-compose.swim.yml \
#            stop swim-ingestor
#
# ── Config files ──────────────────────────────────────────────────────────────
#
#   deploy.env is the preferred user config file (FAA_USER, FAA_PASS, QUEUE_*).
#   Copy deploy.env.example to deploy.env. deploy.env must never be committed.
#
#   swim.env is accepted for backward compatibility when using the manual compose
#   override without setup.sh. swim.env values are overridden by deploy.env if
#   both are present (deploy.env is loaded after swim.env).
#
#   Both files are optional — if absent, SWIM vars default to empty/disabled.
#
# ── Build context ─────────────────────────────────────────────────────────────
#
#   Build context is the repo root (.) so swim_schema.sql can be included
#   in the Docker image for apply_schema.py to use inside the container.
#
# ── Restart policy ────────────────────────────────────────────────────────────
#
#   restart: "no" — intentional for Phase 2A.
#   The probe exits after a bounded window. Phase 2B (continuous ingestion)
#   will switch to restart: on-failure with internal reconnect/backoff logic.

services:
  swim-ingestor:
    build:
      context: .
      dockerfile: swim-ingestor/Dockerfile
    container_name: flightconn-swim-ingestor
    env_file:
      - path: .env
        required: true
      - path: swim.env
        required: false
      - path: deploy.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: flightconn
      DB_USER: flightconn
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
