# FlightConn — Optional SWIM Ingestor Compose Override
#
# This file extends docker-compose.yml with an optional sidecar container
# for FAA SWIM recent flight activity ingestion. The main app (flightconn-app)
# does not depend on this service and runs normally without it.
#
# ── Usage ─────────────────────────────────────────────────────────────────────
#
#   1. Copy swim.env.example to swim.env and fill in FAA credentials.
#   2. Set SWIM_ENABLED=true in swim.env.
#   3. Start with the override:
#
#        docker compose -f docker-compose.yml -f docker-compose.swim.yml up -d
#
#   Probe only (safe, exits after a short window):
#        docker compose -f docker-compose.yml -f docker-compose.swim.yml \
#            run --rm swim-ingestor
#        (Set SWIM_PROBE_ONLY=true in swim.env for probe mode)
#
#   Apply schema only:
#        docker compose -f docker-compose.yml -f docker-compose.swim.yml \
#            run --rm swim-ingestor python apply_schema.py
#
#   Rebuild sidecar after code changes:
#        docker compose -f docker-compose.yml -f docker-compose.swim.yml \
#            build swim-ingestor
#
#   Stop sidecar only:
#        docker compose -f docker-compose.yml -f docker-compose.swim.yml \
#            stop swim-ingestor
#
# ── swim.env ──────────────────────────────────────────────────────────────────
#
#   swim.env is optional. If absent, SWIM vars default to empty/disabled.
#   swim.env must never be committed. See swim.env.example for the template.
#
# ── Build context ─────────────────────────────────────────────────────────────
#
#   Build context is the repo root (.) so swim_schema.sql can be included
#   in the Docker image for apply_schema.py to use inside the container.
#
# ── Restart policy ────────────────────────────────────────────────────────────
#
#   restart: "no" — intentional for Phase 2A.
#   The probe exits after a bounded window. Phase 2B (continuous ingestion)
#   will switch to restart: on-failure with internal reconnect/backoff logic.

services:
  swim-ingestor:
    build:
      context: .
      dockerfile: swim-ingestor/Dockerfile
    container_name: flightconn-swim-ingestor
    env_file:
      - path: .env
        required: true
      - path: swim.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: flightconn
      DB_USER: flightconn
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
