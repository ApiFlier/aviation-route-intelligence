version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: flightconn-frontend
    ports:
      - "8082:80"
    depends_on:
      - api
    restart: always

  api:
    build: ./api
    container_name: flightconn-api
    ports:
      - "8083:8080"
    volumes:
      - ./api/Data:/app/Data
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=flightconn
      - MYSQL_PASSWORD=flightconn
      - MYSQL_DATABASE=flightconn
      - API_DEBUG=true
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mysql:8.0
    container_name: flightconn-db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=flightconn
      - MYSQL_USER=flightconn
      - MYSQL_PASSWORD=flightconn
    volumes:
      - flightconn_mysql:/var/lib/mysql
      - ./api/Data/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  flightconn_mysql:
