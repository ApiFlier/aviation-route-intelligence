services:
  db:
    image: mysql:8.0
    container_name: flightconn-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flightconn
      MYSQL_USER: flightconn
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - flightconn_mysql:/var/lib/mysql
      - ./api/Data/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    container_name: flightconn-api
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: flightconn
      DB_USER: flightconn
      DB_PASSWORD: ${DB_PASSWORD}
      FLASK_SECRET: ${FLASK_SECRET}
    ports:
      - "${API_PORT:-8083}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: flightconn-frontend
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  flightconn_mysql:
