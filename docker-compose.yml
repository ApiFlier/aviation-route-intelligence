services:
  db:
    image: mysql:8.0
    container_name: flightconn-db
    # 512M buffer pool prevents InnoDB lock table overflow (error 1206) during
    # large SWIM aggregation transactions. Reduce to 256M on hosts with <4GB RAM.
    command: >
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flightconn
      MYSQL_USER: flightconn
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - flightconn_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: flightconn-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: flightconn
      DB_USER: flightconn
      DB_PASSWORD: ${DB_PASSWORD}
      FLASK_SECRET: ${FLASK_SECRET}
    ports:
      - "${APP_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  swim-ingestor:
    profiles:
      - swim
    build:
      context: .
      dockerfile: swim-ingestor/Dockerfile
    container_name: flightconn-swim-ingestor
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
      - deploy.env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: flightconn
      DB_USER: flightconn
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flightconn_mysql:
    name: flightconn_mysql   # explicit name prevents compose from prepending the project directory
