services:
  db:
    image: mysql:8.0
    container_name: flightconn-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flightconn
      MYSQL_USER: flightconn
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - flightconn_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: flightconn-app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: flightconn
      DB_USER: flightconn
      DB_PASSWORD: ${DB_PASSWORD}
      FLASK_SECRET: ${FLASK_SECRET}
    ports:
      - "${APP_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flightconn_mysql:
    name: flightconn_mysql   # explicit name prevents compose from prepending the project directory
